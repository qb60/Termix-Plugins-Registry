name: Sync and deploy registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - plugins.json
      - registry.pub
      - schemas/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/sync.yml
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [plugin-released]
permissions:
  contents: read
concurrency:
  group: registry-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - name: Restore deployed index
        run: node scripts/restore-state.mjs
      - name: Verify releases and build index
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run validate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
